[package]
name = "startup"
version = "0.1.0"
authors = ["kagesyntax <em2009manu2010el@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.7", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
wasm-bindgen = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
